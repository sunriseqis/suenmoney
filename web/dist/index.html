<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SuenMoney · 家庭记账</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      主题内联脚本 —— **必须在 Vue 挂载前执行**。
      默认深色（cyber）：跟随系统会让浅色系统用户看到两套不同的设计语言。
      值写成 candy / cyber，与原型 design system 的 data-theme 取值一致。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('suenmoney:theme');
          var theme = saved === 'light' ? 'candy' : saved === 'dark' ? 'cyber' : null;
          if (!theme) {
            var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = dark ? 'cyber' : 'candy';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'cyber';
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-irfloG_b.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DdINmPKI.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
