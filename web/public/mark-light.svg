  <!-- v3 母版：一台计算器，屏幕显示 88.88，键位亮出 S（≥32px）
       屏 600×184 装不下六位（第四位起互相叠字），用户裁决改 88.88：
       四位大数字，位宽 96 / 段厚 18 / 位高 136 / 间隙 26，左右各余 33。
       选 88.88 的理由不变：8 是七段管点亮段最多的字符，且 88.88 是
       「账单金额」的自然形状 —— 远看是一块发光的金额窗。
       小数点做成方形段（与七段同语言），柠色，同第三位。
       键盘 4×5，格 135×106 r34，起点 (212,324)，与屏同宽 600。
       亮键 11 / 暗键 9 照抄原版：上横薄荷 → 左竖紫 → 中横蓝 → 右竖柠 → 下横粉 -->
  
