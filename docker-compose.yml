# ==============================================================================
# SuenMoney Docker Compose 生产部署编排
# 镜像托管于 GitHub Container Registry (ghcr.io)，本文件为**纯拉取部署**，
# 不含 build 段 —— 部署机上不需要仓库源码，只要这一个 yml 即可。
# 本地开发构建请叠加覆写文件：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 使用指南：
#   启动运行：docker compose up -d
#   停止服务：docker compose down
#   更新版本：docker compose pull && docker compose up -d
# ==============================================================================

services:
  suenmoney-server:
    image: ghcr.io/sunriseqis/suenmoney-server:latest
    container_name: suenmoney-server
    restart: unless-stopped
    ports:
      - "3310:3310"
    environment:
      - SUENMONEY_HOST=0.0.0.0
      - SUENMONEY_PORT=3310
      - SUENMONEY_DB_PATH=/app/data/suenmoney.sqlite
      - SUENMONEY_BACKUP_DIR=/app/data/backups
      - SUENMONEY_BACKUP_KEEP=14
      # 时区：镜像默认已是 Asia/Shanghai；宿主机若在他处可在此覆盖
      # - TZ=Asia/Shanghai
      # 可选：开放自动注册（默认仅允许管理员建号）
      # - SUENMONEY_ALLOW_REGISTRATION=false
    volumes:
      - suenmoney-data:/app/data

  suenmoney-web:
    image: ghcr.io/sunriseqis/suenmoney-web:latest
    container_name: suenmoney-web
    restart: unless-stopped
    ports:
      - "5310:80"
    environment:
      - BACKEND_URL=http://suenmoney-server:3310
      # 时区：镜像默认已是 Asia/Shanghai（影响 Nginx 访问日志时间戳）
      # - TZ=Asia/Shanghai
    depends_on:
      - suenmoney-server

volumes:
  suenmoney-data:
    name: suenmoney-data
