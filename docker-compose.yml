# ==============================================================================
# SuenMoney Docker Compose 生产部署编排（单容器 / 单端口）
#
# 镜像托管于 GitHub Container Registry (ghcr.io)，本文件为**纯拉取部署**，
# 不含 build 段 —— 部署机上不需要仓库源码，只要这一个 yml 即可。
# 本地开发构建请叠加覆写文件：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 使用指南：
#   启动运行：docker compose up -d
#   停止服务：docker compose down
#   更新版本：docker compose pull && docker compose up -d
#
# **只有一个端口 5310**：它同时是页面地址与接口地址 —— 服务端自己托管前端产物，
# 前端只走同源相对路径。浏览器、App、原生客户端填的都是 http://<宿主机IP>:5310，
# 没有第二个端口要记，也没有 BACKEND_URL 要配。
# ==============================================================================

services:
  suenmoney:
    image: ghcr.io/sunriseqis/suenmoney:latest
    container_name: suenmoney
    restart: unless-stopped
    ports:
      - "5310:5310"
    environment:
      - SUENMONEY_PORT=5310
      - SUENMONEY_WEB_ROOT=/app/web/dist
      - SUENMONEY_DB_PATH=/app/data/suenmoney.sqlite
      - SUENMONEY_BACKUP_DIR=/app/data/backups
      - SUENMONEY_BACKUP_KEEP=14
      # 前面没有反向代理时**不要**打开：开了等于允许客户端伪造 X-Forwarded-For，
      # 登录限流（按 IP 计数）会被绕过。用户自建 Caddy/nginx 做 TLS 时才改成 true。
      - SUENMONEY_TRUST_PROXY=false
      # 时区：镜像默认已是 Asia/Shanghai；宿主机若在他处可在此覆盖
      # - TZ=Asia/Shanghai
      # 可选：开放自动注册（默认仅允许管理员建号）
      # - SUENMONEY_ALLOW_REGISTRATION=false
    volumes:
      - suenmoney-data:/app/data

volumes:
  suenmoney-data:
    name: suenmoney-data
