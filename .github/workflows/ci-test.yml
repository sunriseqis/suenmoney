name: CI Test & Lint

# ⚠ 自动构建已关闭（2026-10-21）：本工作流只保留手动派发（workflow_dispatch）。
#   存储/额度都是自己掏的，日常推送不该自动烧构建；需要构建时手动派发，
#   恢复自动触发的做法见 docs/ci.md，原触发器原文可从 git 历史取回。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Run Typecheck, Tests and Web Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm --prefix server ci
          npm --prefix web ci

      - name: Run Full Checks
        run: |
          npm run check
