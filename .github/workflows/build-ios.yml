name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ios/**'
      - 'web/**'
      - 'VERSION'
      - 'scripts/**'
      - '.github/workflows/build-ios.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号（可选，例如 1.1，留空则默认按 VERSION 文件）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '是否发布到 GitHub Release'
        required: true
        type: boolean
        default: true
      release_notes:
        description: '发布说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # versionCode 需计算提交历史数，必须是完整历史
          fetch-depth: 0

      # Capacitor 8.5.2 的 iOS 二进制（capacitor-swift-pm）由 Swift 6.2 编译，
      # 必须用带 Swift ≥6.2 的 Xcode（≥ 26.0.1）读取其 .swiftinterface，
      # 否则老编译器会漏掉 CAPPluginCall.reject 等成员导致编译失败。
      # 明确钉到 26.3（Swift 6.2.3）：与本机对齐、可复现；且它是仍能装在
      # macOS Sequoia(macOS-15 runner) 上的最新版（26.4+ 需要 Tahoe 26.2）。
      - name: Select Xcode 26.3 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Determine Version
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((10000 + COMMIT_COUNT))
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          BASE_VER="1.0"
          if [ -f "VERSION" ]; then
            BASE_VER=$(cat VERSION | tr -d ' \n\r')
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RAW_VERSION="${TAG_NAME#v}"
            VERSION="${TAG_NAME}"
            VERSION_NAME="${RAW_VERSION}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.custom_version }}" ]]; then
            INPUT_VER="${{ inputs.custom_version }}"
            if [[ "$INPUT_VER" == v* ]]; then
              VERSION="$INPUT_VER"
              VERSION_NAME="${INPUT_VER#v}"
            else
              VERSION="v$INPUT_VER"
              VERSION_NAME="$INPUT_VER"
            fi
          else
            VERSION_NAME="${BASE_VER}"
            VERSION="v${VERSION_NAME}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "=== 正在构建 iOS 未签名 IPA ==="
          echo "Version Name: ${VERSION_NAME}"
          echo "Version Code: ${VERSION_CODE}"
          echo "Release Tag : ${VERSION}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Unsigned IPA
        run: |
          node scripts/build-ios.mjs --unsigned

      - name: Collect Artifact
        run: |
          mkdir -p app
          SRC="app/unsigned/SuenMoney-v${VERSION_NAME}-release.ipa"
          if [ ! -f "$SRC" ]; then
            SRC="app/SuenMoney-v${VERSION_NAME}-release.ipa"
          fi
          if [ ! -f "$SRC" ]; then
            echo "找不到 IPA：$SRC" >&2
            ls -R app >&2 || true
            exit 1
          fi
          cp "$SRC" "app/SuenMoney-${VERSION}-release.ipa"

          # 校验 IPA 文件格式与内容完整性
          IPA="app/SuenMoney-${VERSION}-release.ipa"
          unzip -t "$IPA" > /dev/null || { echo "✖ IPA 完整性校验失败"; exit 1; }
          unzip -l "$IPA" | grep -q 'Payload/App.app/App' || {
            echo "✖ IPA 里找不到 Payload/App.app/App"; unzip -l "$IPA" | head -5; exit 1;
          }
          if unzip -l "$IPA" | grep -q '__MACOSX'; then
            echo "✖ IPA 里混入了 __MACOSX 条目"; exit 1;
          fi
          echo "✔ IPA 结构与签名准备校验通过（$(unzip -l "$IPA" | tail -1 | awk '{print $2}') 个条目）"
          ls -lh app/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuenMoney-${{ env.VERSION }}-ipa
          path: app/*.ipa
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SuenMoney ${{ env.VERSION }} 移动端
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ### SuenMoney ${{ env.VERSION }} 移动端发布 🎉

            #### 📱 安装包（统一在 `app/` 目录）：
            - `SuenMoney-${{ env.VERSION }}-release.apk`：安卓正式安装包，下载后可直接在手机上点击安装。
            - `SuenMoney-${{ env.VERSION }}-release.ipa`：iOS 未签名安装包，可使用 AltStore / SideStore / TrollStore 等重签工具安装。

            > ⚠️ **请从本 Release 下载附件安装**。Actions 页面里的 Artifact 是 GitHub 额外套的一层 zip，直接改后缀丢给安装工具会报 `archive appears to be corrupt`。
            >
            > 由 GitHub Actions 自动化流水线构建。
            ${{ inputs.release_notes && format('#### 📝 更新说明：\n{0}', inputs.release_notes) || '' }}
          files: |
            app/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
