name: Build and Push Image to GHCR

# ==============================================================================
# 单镜像构建：前端与服务端打进同一个镜像，一个进程同时提供页面与 /api。
#
# **手动派发**（不再随推送自动构建，见文件下方 on: 段与 docs/ci.md）。
# 手动跑时默认推 latest；带 tag 派发则额外推 semver（tags 规则仍在 metadata-action 里）。
# 多架构 linux/amd64 + linux/arm64。
#
# 历史镜像 `suenmoney-server` / `suenmoney-web` **不再更新**，保留在 GHCR 供回滚；
# 新部署一律使用 `suenmoney`。
# ==============================================================================

# ⚠ 自动构建已关闭（2026-10-21）：本工作流只保留手动派发（workflow_dispatch）。
#   存储/额度都是自己掏的，日常推送不该自动烧构建；需要构建时手动派发，
#   恢复自动触发的做法见 docs/ci.md，原触发器原文可从 git 历史取回。
on:
  workflow_dispatch:
    inputs:
      push_images:
        description: '是否推送到 ghcr.io'
        required: true
        type: boolean
        default: true
      custom_tag:
        description: '自定义镜像 Tag（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build & Push SuenMoney Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU (Multi-arch support)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Lowercase Owner Name
        id: owner
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LC}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/suenmoney
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}

      # 构建上下文是仓库根：镜像里同时要有 web/dist 与 server/ 源码
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=suenmoney
          cache-to: type=gha,mode=max,scope=suenmoney
