name: Build fnOS FPK

# ⚠ 自动构建已关闭（2026-10-21）：本工作流只保留手动派发（workflow_dispatch）。
#   存储/额度都是自己掏的，日常推送不该自动烧构建；需要构建时手动派发，
#   恢复自动触发的做法见 docs/ci.md，原触发器原文可从 git 历史取回。
on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号（可选，例如 2.0.0，留空则按 VERSION 文件）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '是否发布到发行仓库 sunriseqis/suenapp 的 Release'
        required: true
        type: boolean
        default: true
      release_notes:
        description: '发布说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-fnos:
    name: Build & Release fnOS FPK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ⚠ 这里**故意不用** setup-node 的 `cache: 'npm'`。
      #
      # 本仓库根目录**没有** package-lock.json（.gitignore 第 9 行 `/package-lock.json`
      # 特意排除，前后端各自在 server/ 与 web/ 下），而 setup-node 的 npm 缓存
      # 只认 working directory 下的 lockfile；即便给了 `cache-dependency-path`，
      # 实测在 runner 上仍会先按默认 patterns 探测仓库根并抛：
      #   "Dependencies lock file is not found in /home/runner/work/.../suenmoney"
      #
      # 缓存省下的那点安装时间，不值得换来一个「每次派发都可能挂」的失败点。
      # 真要缓存，等根目录有 lockfile 之后再加（见 docs/ci.md）。
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          # 与 scripts/build-fn.mjs 里内置的 NODE_VERSION 对齐（node:sqlite 要求 ≥22.9）
          node-version: '24'

      - name: Determine Version
        id: ver
        run: |
          set -euo pipefail
          RAW="$(tr -d '[:space:]' < VERSION)"
          CUSTOM="${{ github.event.inputs.custom_version }}"
          CUSTOM="${CUSTOM#v}"
          if [ -n "${CUSTOM}" ]; then VER="${CUSTOM}"; else VER="${RAW}"; fi

          # fnOS manifest 要求严格 X.Y.Z，缺位补 0
          # ⚠ 不要写成 `[ cond ] && C=0`：在 set -e 下条件为假会让整个 step 失败
          A="${VER%%.*}"
          REST="${VER#*.}"
          if [ "${REST}" = "${VER}" ]; then
            B=0; C=0
          else
            B="${REST%%.*}"
            C="${REST#*.}"
            if [ "${C}" = "${REST}" ]; then C=0; fi
            if [ -z "${C}" ]; then C=0; fi
          fi
          SEMVER="${A}.${B}.${C}"
          if ! printf '%s' "${SEMVER}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "✖ 版本号不合法：'${SEMVER}'（原始输入 '${VER}'）"
            exit 1
          fi
          echo "version=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "解析版本：${SEMVER}"

      - name: Install Dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix web ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund

      # CI 里 git checkout 出来的文件 mtime 几乎相同，build-fn.mjs 的
      # `isStale(web/dist, src|public|…)` 用 mtime 比大小判断是否陈旧 —— 在这种
      # 场景下会误判「dist 是最新的」而直接复用提交里的 dist。
      # 若某次改了 web/src 却忘了重新 build 就提交，包里就会带旧前端，而且
      # 包体积、sha256 全都正常，极难发现。所以这里先显式重建一次。
      - name: Build Web Assets
        run: npm --prefix web run build

      - name: Build fnOS FPK
        run: |
          set -e
          VER="${{ steps.ver.outputs.version }}"
          # build-fn.mjs 从根 VERSION 读版本并注入 manifest / app VERSION，
          # 自定义版本时先写回文件，保证三处同源（否则 manifest 与 Release 标签会不一致）
          echo "${VER}" > VERSION
          node scripts/build-fn.mjs

      - name: Verify Artifacts
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          NAME="suenmoney-v${VER}.fpk"
          FPK="output/${NAME}"
          test -f "${FPK}"        || { echo "✖ 未找到产物 ${FPK}"; ls -la output/ || true; exit 1; }
          test -f "${FPK}.sha256" || { echo "✖ 缺少校验文件"; exit 1; }

          SIZE="$(stat -c %s "${FPK}")"
          MB="$(awk -v s="${SIZE}" 'BEGIN{printf "%.2f", s/1048576}')"
          echo "包体积：${SIZE} 字节（${MB} MB）"

          # 空包/半截包的直接信号：正常应 >30MB（内含 Node 运行时 + 生产依赖）
          if [ "${SIZE}" -lt 30000000 ]; then
            echo "✖ 包体积异常偏小（${MB} MB < 30MB），多半是 payload 没装配完整"
            exit 1
          fi

          # ⚠ .sha256 里写的是**相对 output/ 的文件名**（suenmoney-vX.Y.Z.fpk），
          # 所以在仓库根跑 `sha256sum -c output/xxx.sha256` 会 FAILED open or read。
          # 必须进 output/ 再校验。
          ( cd output && sha256sum -c "${NAME}.sha256" )

          echo "✓ 产物校验通过"
          {
            echo "### 产物"
            echo ""
            echo "| 文件 | 大小 | SHA256 |"
            echo "|---|---|---|"
            echo "| \`${NAME}\` | ${MB} MB | \`$(awk '{print $1}' "${FPK}.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Release Notes
        if: ${{ inputs.publish_release }}
        run: |
          node scripts/prepare-release-notes.mjs \
            --platform fnos \
            --tag "suenmoney-v${{ steps.ver.outputs.version }}" \
            --output /tmp/release_body.md
          echo "--- 发布说明 ---"
          cat /tmp/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.SUENAPP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish to sunriseqis/suenapp
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          repository: sunriseqis/suenapp
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.SUENAPP_TOKEN || secrets.GITHUB_TOKEN }}
          # ⚠ tag **必须带 suenmoney- 前缀**。
          #
          # 发行仓库 sunriseqis/suenapp 是 suenmusic / suenweb / suenmoney 共用的，
          # 而 softprops/action-gh-release 遇到**已存在的 tag 会更新那个 Release**
          # （改 name、覆盖 body、追加附件），不是新建。
          # 2026-10-31 就用裸 `v2.0.0` 直接把 suenmusic 的同名发行页改成了
          # 「SuenMoney v2.0.0」并混入 suenmoney 附件 —— 已手工恢复。
          # 前缀约定与 suenweb 的 `suenweb-v2.0.0` 一致。
          tag_name: suenmoney-v${{ steps.ver.outputs.version }}
          name: SuenMoney v${{ steps.ver.outputs.version }}
          body_path: /tmp/release_body.md
          files: |
            output/suenmoney-v${{ steps.ver.outputs.version }}.fpk
            output/suenmoney-v${{ steps.ver.outputs.version }}.fpk.sha256
          draft: false
          prerelease: false
          make_latest: true
          append_body: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: suenmoney-fnos-${{ steps.ver.outputs.version }}
          path: |
            output/*.fpk
            output/*.sha256
          retention-days: 14
