name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - 'web/**'
      - 'VERSION'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号（可选，例如 1.1，留空则默认按 VERSION 文件）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '是否发布到 GitHub Release'
        required: true
        type: boolean
        default: true
      release_notes:
        description: '发布说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # versionCode 需计算提交历史数，必须是完整历史
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          # versionCode 基数 10000，按提交总数自增
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((10000 + COMMIT_COUNT))
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          # 读取当前正式版本号（默认为 1.0）
          BASE_VER="1.0"
          if [ -f "VERSION" ]; then
            BASE_VER=$(cat VERSION | tr -d ' \n\r')
          fi

          # 计算 versionName 与 Release 标题
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RAW_VERSION="${TAG_NAME#v}"
            VERSION="${TAG_NAME}"
            VERSION_NAME="${RAW_VERSION}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.custom_version }}" ]]; then
            INPUT_VER="${{ inputs.custom_version }}"
            if [[ "$INPUT_VER" == v* ]]; then
              VERSION="$INPUT_VER"
              VERSION_NAME="${INPUT_VER#v}"
            else
              VERSION="v$INPUT_VER"
              VERSION_NAME="$INPUT_VER"
            fi
          else
            VERSION_NAME="${BASE_VER}"
            VERSION="v${VERSION_NAME}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "=== 正在构建 Android APK 正式版 ==="
          echo "Version Name (显示版本): ${VERSION_NAME}"
          echo "Version Code (内部自增): ${VERSION_CODE}"
          echo "Release Tag  (发布标签): ${VERSION}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Web Dependencies & Build Frontend
        run: |
          cd web
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PversionCode=${{ env.VERSION_CODE }} -PversionName="${{ env.VERSION_NAME }}" --stacktrace

      # 产物统一归口到 app/ 目录
      - name: Collect Artifact
        run: |
          mkdir -p app
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "找不到 APK：$APK" >&2
            exit 1
          fi
          cp "$APK" "app/SuenMoney-${VERSION}-release.apk"
          ls -lh app/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuenMoney-${{ env.VERSION }}-apk
          path: app/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SuenMoney ${{ env.VERSION }} 移动端
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ### SuenMoney ${{ env.VERSION }} 移动端发布 🎉

            #### 📱 安装包（统一在 `app/` 目录）：
            - `SuenMoney-${{ env.VERSION }}-release.apk`：安卓正式包，下载后可直接在手机上点击安装。

            > ⚠️ **请从本 Release 下载附件安装**。Actions 页面里的 Artifact 是 GitHub 额外套的一层
            > zip，直接改后缀丢给安装工具会失败。
            >
            > 由 GitHub Actions 自动化流水线构建。
            ${{ inputs.release_notes && format('#### 📝 更新说明：\n{0}', inputs.release_notes) || '' }}
          files: |
            app/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
