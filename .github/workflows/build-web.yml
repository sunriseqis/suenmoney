name: Build and Push Web Image to GHCR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - 'VERSION'
      - '.github/workflows/build-web.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_images:
        description: '是否推送到 ghcr.io'
        required: true
        type: boolean
        default: true
      custom_tag:
        description: '自定义镜像 Tag（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    name: Build & Push Web Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU (Multi-arch support)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Lowercase Owner Name
        id: owner
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LC}" >> $GITHUB_OUTPUT
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LC}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Web
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/suenmoney-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
