name: Build HarmonyOS HAP

# ⚠ 自动构建已关闭（2026-10-21）：本工作流只保留手动派发（workflow_dispatch）。
#   存储/额度都是自己掏的，日常推送不该自动烧构建；需要构建时手动派发，
#   恢复自动触发的做法见 docs/ci.md，原触发器原文可从 git 历史取回。
on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号（可选，例如 1.1，留空则默认按 VERSION 文件）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '是否发布到 GitHub Release'
        required: true
        type: boolean
        default: true
      release_notes:
        description: '发布说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# ⚠ **同一版本的四个 workflow 必须串行写 suenapp 的 Release body**。
#
# 四个 workflow 各自对同一个 Release body 做「GET 现有 body → 本地合并 → PUT 整体覆盖」。
# 两个同时（或重叠窗口内）发布时，后 PUT 者会用只含自己那节的 body 覆盖先 PUT 者
# 刚写入的那节 —— 别的平台的 SECTION 静默消失，且流程全绿（2026-11-20 实测复现）。
#
# 用 `suenapp-release-<版本>` 作并发组（不是按 ref）：两个版本的并发**应该**允许，
# 只有同一版本的四个平台必须互斥。
#
# ⚠ 取消旧运行而不是排队：`cancel-in-progress: false` 会让后来的 run 排队等前面的
# 跑完（顺序正确）。设 `true` 则会取消进行中的那个 —— 那是错的，被取消的 run
# 可能已经写了一半。
concurrency:
  # ⚠ **所有 suenapp 发布 workflow 共用同一把锁**（不分版本）。
  # 发布目标是 suenapp 的同一个 Release，任何两个平台同时写 body 都会冲突 ——
  # 即使是不同版本也会互相覆盖（因为 softprops 用的是 tag_name 找 Release）。
  # 用固定的 group 名 = 全局串行，简单且绝对安全。
  group: suenapp-release-publish
  cancel-in-progress: false

jobs:
  build-hw:
    name: Build HarmonyOS HAP (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # versionCode 需计算提交历史数，必须是完整历史
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Determine Version
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((10000 + COMMIT_COUNT))
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          BASE_VER="1.0"
          if [ -f "VERSION" ]; then
            BASE_VER=$(cat VERSION | tr -d ' \n\r')
          fi

          CUSTOM_VER="${{ inputs.custom_version }}"
          if [ -n "$CUSTOM_VER" ]; then
            VERSION_NAME="$CUSTOM_VER"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            VERSION_NAME="${TAG_VER}"
          else
            VERSION_NAME="${BASE_VER}"
          fi

          VERSION="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "✔ 目标版本: ${VERSION} (VersionCode: ${VERSION_CODE})"

      # 原生工程（hw-native）自己就是 ArkTS 页面，不消费 web/dist。
      # `hw/` 是 Capacitor 时代的 WKWebView 壳，与 android/ 一样已冻结。
      - name: Inject Version into HarmonyOS App
        run: |
          # 注入版本号至 AppScope/app.json5
          node -e '
            const fs = require("fs");
            const p = "hw-native/AppScope/app.json5";
            let c = fs.readFileSync(p, "utf8");
            c = c.replace(/"versionName":\s*"[^"]*"/, `"versionName": "${process.env.VERSION_NAME}"`);
            c = c.replace(/"versionCode":\s*\d+/, `"versionCode": ${process.env.VERSION_CODE}`);
            fs.writeFileSync(p, c, "utf8");
          '

      - name: Build HarmonyOS Unsigned HAP
        run: |
          echo "=== 启动 HarmonyOS 云端构建容器 (API 26r / command-line-tools) ==="
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/hw-native \
            ghcr.io/dalongzhuazi/harmonyos-ci:api26r \
            bash -c '
              set -eo pipefail
              set -x
              ohpm install --all || true

              echo "--- 开始执行 Hvigor 构建 ---"
              hvigorw assembleHap \
                --mode module \
                -p product=default \
                -p buildMode=debug \
                --no-daemon \
                --stacktrace 2>&1 | tee /workspace/build.log

              echo "--- 查找构建产物 ---"
              mkdir -p /workspace/app
              FOUND_HAP=$(find /workspace/hw-native -type f -name "*.hap" | head -n 1)
              if [ -n "$FOUND_HAP" ] && [ -f "$FOUND_HAP" ]; then
                echo "找到产物: $FOUND_HAP"
                # ⚠ 产物命名是**裁决过的统一口径**：`suenmoney-<版本>.<ext>`
                #   （fpk / ipa / hap 三端一致，全小写、不带 v、不带 -unsigned/-release 后缀）。
                # 这里必须与下游三处（Verify Artifact / Upload HAP / Publish Release）
                # 以及清理白名单逐字一致，否则构建成功也会卡在 Verify Artifact 报 exit 1。
                cp -v "$FOUND_HAP" "/workspace/app/suenmoney-${{ env.VERSION_NAME }}.hap"
              else
                echo "未在 /workspace/hw-native 找到 .hap，检索工作区:"
                find /workspace -type f -name "*.hap" || true
                echo "=== 输出构建日志末尾 120 行 ==="
                tail -n 120 /workspace/build.log 2>/dev/null || true
                exit 1
              fi
              chmod -R 777 /workspace/app /workspace/hw-native/build /workspace/hw-native/entry/build /workspace/build.log 2>/dev/null || true
            '

      # 把构建日志尾部写进 Job Summary，作为「匿名可读」的失败诊断通道。
      # 为什么要这么做：ArkTS 编译器只报首个致命错误（COMPILE RESULT:FAIL {ERROR:2} 仅列 1 条），
      # 改一处才能暴露下一处；而 Actions step 日志与 harmony-build-log artifact 对本机匿名访问
      # 均返回 401/403，check-run annotations 只有一句 "Process completed with exit code 255."，
      # 导致只能盲改、每轮 4 分钟且无信息。Job Summary 可通过公开 check-runs API 的
      # output.summary 匿名读取，写入后下一次失败无需人工贴日志即可定位。
      - name: Append Build Log Tail to Job Summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # 容器内 /workspace 挂载的是 ${GITHUB_WORKSPACE}，故日志真实路径为工作区根目录 build.log
          LOG="build.log"
          {
            echo "### 鸿蒙构建日志尾部"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$LOG" ]; then
            # 只截尾部 200 行：Job Summary 上限 1MB，全量日志会导致本步骤失败
            {
              echo '```'
              tail -n 200 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "无构建日志文件（$LOG 不存在，构建可能在容器启动阶段即失败）。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 产物校验
      - name: Verify Artifact
        run: |
          mkdir -p app
          ls -lh app/ 2>/dev/null || true
          HAP="app/suenmoney-${{ env.VERSION_NAME }}.hap"
          if [ ! -f "$HAP" ]; then
            echo "✖ 未找到 $HAP！输出构建日志末尾 120 行：" >&2
            tail -n 120 build.log 2>/dev/null || true
            exit 1
          fi

          # 校验 HAP 文件完整性（HAP 本质是 ZIP 包容器）
          unzip -t "$HAP" > /dev/null || { echo "✖ HAP 完整性校验失败"; exit 1; }
          echo "✔ HAP 完整性校验通过（包含 $(unzip -l "$HAP" | tail -1 | awk '{print $2}') 个条目）"

      # 构建失败时也上传日志：本次鸿蒙构建失败后，本机没有 token 拿不到 Actions 日志本体
      # （匿名下载被拒），无法定位问题。always() 保证失败路径下也能下载完整 build.log。
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-build-log
          # 容器内通过 -v "${GITHUB_WORKSPACE}:/workspace" 挂载，日志写在 /workspace/build.log，
          # 即宿主工作目录下的 build.log，无需额外 cp。
          path: build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: suenmoney-${{ env.VERSION_NAME }}
          path: app/suenmoney-${{ env.VERSION_NAME }}.hap
          retention-days: 30

      # ❌ 已删除（2026-11-20）：「Clean Up Redundant Release Assets」步骤是四重失效的死代码，
      # 任何情况下都不会执行，给人假安全感。删除原因：
      #
      #   1. 条件恒假：`if: startsWith(github.ref, 'refs/tags/v')` —— 但本 workflow 是纯
      #      `workflow_dispatch`，`github.ref` 只会是分支（`refs/heads/...`），永远不会是
      #      `refs/tags/v*`，整个步骤从不跑在 tag ref 上。
      #   2. 查错仓库：`env.GITHUB_REPOSITORY` = suenmoney（源仓库），但要清理的 Release
      #      在 sunriseqis/suenapp（发行仓库）。即使条件成立，也是 404 跳过。
      #   3. token 错：`secrets.GITHUB_TOKEN` 是本仓库只读 token，对 suenapp 无写权限。
      #   4. tag 会 404：`env.VERSION` = v2.1.1（裸 v），但发行 tag 是 suenmoney-v2.1.1。
      #
      # 需要清理冗余资产时，在 Publish 步骤后手动跑一次（用正确的 token 和 repo）。

      # 上面的 Upload Build Log / Upload HAP Artifact 均无 main/master 判断，
      # push main 时照常上传 Actions artifact，保持「随时下载最新包测试」的能力。
      - name: Prepare Release Notes
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        run: |
          node scripts/prepare-release-notes.mjs \
            --platform harmony \
            --tag "suenmoney-v${{ env.VERSION_NAME }}" \
            --output /tmp/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.SUENAPP_TOKEN || secrets.GITHUB_TOKEN }}

      # 三端（fnos / hw / ios）共用**同一个** Release：tag 都是 suenmoney-vX.Y.Z，
      # 各自只替换自己那节 SECTION（由 scripts/prepare-release-notes.mjs 负责），
      # 所以先后发布不会互相覆盖。
      #
      # ⚠ tag 必须带 suenmoney- 前缀：suenapp 是 suenmusic / suenweb / suenmoney
      #   䅆用的发行仓库，裸 vX.Y.Z 会直接改写别的项目的同名发行页（2026-10-31 出过事故）。
      - name: Publish Release to sunriseqis/suenapp
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          repository: sunriseqis/suenapp
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.SUENAPP_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: suenmoney-v${{ env.VERSION_NAME }}
          name: SuenMoney ${{ env.VERSION }}
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
          make_latest: true
          append_body: false
          files: |
            app/suenmoney-${{ env.VERSION_NAME }}.hap
