name: Build HarmonyOS HAP

# ⚠ 自动构建已关闭（2026-10-21）：本工作流只保留手动派发（workflow_dispatch）。
#   存储/额度都是自己掏的，日常推送不该自动烧构建；需要构建时手动派发，
#   恢复自动触发的做法见 docs/ci.md，原触发器原文可从 git 历史取回。
on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号（可选，例如 1.1，留空则默认按 VERSION 文件）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '是否发布到 GitHub Release'
        required: true
        type: boolean
        default: true
      release_notes:
        description: '发布说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-hw:
    name: Build HarmonyOS HAP (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # versionCode 需计算提交历史数，必须是完整历史
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Determine Version
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((10000 + COMMIT_COUNT))
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          BASE_VER="1.0"
          if [ -f "VERSION" ]; then
            BASE_VER=$(cat VERSION | tr -d ' \n\r')
          fi

          CUSTOM_VER="${{ inputs.custom_version }}"
          if [ -n "$CUSTOM_VER" ]; then
            VERSION_NAME="$CUSTOM_VER"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            VERSION_NAME="${TAG_VER}"
          else
            VERSION_NAME="${BASE_VER}"
          fi

          VERSION="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "✔ 目标版本: ${VERSION} (VersionCode: ${VERSION_CODE})"

      - name: Build Web Assets and Sync to HarmonyOS
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          node scripts/sync-hw.mjs
          # 注入版本号至 AppScope/app.json5
          node -e '
            const fs = require("fs");
            const p = "hw/AppScope/app.json5";
            let c = fs.readFileSync(p, "utf8");
            c = c.replace(/"versionName":\s*"[^"]*"/, `"versionName": "${process.env.VERSION_NAME}"`);
            c = c.replace(/"versionCode":\s*\d+/, `"versionCode": ${process.env.VERSION_CODE}`);
            fs.writeFileSync(p, c, "utf8");
          '

      - name: Build HarmonyOS Unsigned HAP
        run: |
          echo "=== 启动 HarmonyOS 云端构建容器 (API 26r / command-line-tools) ==="
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/hw \
            ghcr.io/dalongzhuazi/harmonyos-ci:api26r \
            bash -c '
              set -eo pipefail
              set -x
              ohpm install --all || true

              echo "--- 开始执行 Hvigor 构建 ---"
              hvigorw assembleHap \
                --mode module \
                -p product=default \
                -p buildMode=debug \
                --no-daemon \
                --stacktrace 2>&1 | tee /workspace/build.log

              echo "--- 查找构建产物 ---"
              mkdir -p /workspace/app
              FOUND_HAP=$(find /workspace/hw -type f -name "*.hap" | head -n 1)
              if [ -n "$FOUND_HAP" ] && [ -f "$FOUND_HAP" ]; then
                echo "找到产物: $FOUND_HAP"
                cp -v "$FOUND_HAP" "/workspace/app/SuenMoney-${{ env.VERSION }}-unsigned.hap"
              else
                echo "未在 /workspace/hw 找到 .hap，检索工作区:"
                find /workspace -type f -name "*.hap" || true
                echo "=== 输出构建日志末尾 120 行 ==="
                tail -n 120 /workspace/build.log 2>/dev/null || true
                exit 1
              fi
              chmod -R 777 /workspace/app /workspace/hw/build /workspace/hw/entry/build /workspace/build.log 2>/dev/null || true
            '

      # 把构建日志尾部写进 Job Summary，作为「匿名可读」的失败诊断通道。
      # 为什么要这么做：ArkTS 编译器只报首个致命错误（COMPILE RESULT:FAIL {ERROR:2} 仅列 1 条），
      # 改一处才能暴露下一处；而 Actions step 日志与 harmony-build-log artifact 对本机匿名访问
      # 均返回 401/403，check-run annotations 只有一句 "Process completed with exit code 255."，
      # 导致只能盲改、每轮 4 分钟且无信息。Job Summary 可通过公开 check-runs API 的
      # output.summary 匿名读取，写入后下一次失败无需人工贴日志即可定位。
      - name: Append Build Log Tail to Job Summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # 容器内 /workspace 挂载的是 ${GITHUB_WORKSPACE}，故日志真实路径为工作区根目录 build.log
          LOG="build.log"
          {
            echo "### 鸿蒙构建日志尾部"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$LOG" ]; then
            # 只截尾部 200 行：Job Summary 上限 1MB，全量日志会导致本步骤失败
            {
              echo '```'
              tail -n 200 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "无构建日志文件（$LOG 不存在，构建可能在容器启动阶段即失败）。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 产物校验
      - name: Verify Artifact
        run: |
          mkdir -p app
          ls -lh app/ 2>/dev/null || true
          HAP="app/SuenMoney-${{ env.VERSION }}-unsigned.hap"
          if [ ! -f "$HAP" ]; then
            echo "✖ 未找到 $HAP！输出构建日志末尾 120 行：" >&2
            tail -n 120 build.log 2>/dev/null || true
            exit 1
          fi

          # 校验 HAP 文件完整性（HAP 本质是 ZIP 包容器）
          unzip -t "$HAP" > /dev/null || { echo "✖ HAP 完整性校验失败"; exit 1; }
          echo "✔ HAP 完整性校验通过（包含 $(unzip -l "$HAP" | tail -1 | awk '{print $2}') 个条目）"

      # 构建失败时也上传日志：本次鸿蒙构建失败后，本机没有 token 拿不到 Actions 日志本体
      # （匿名下载被拒），无法定位问题。always() 保证失败路径下也能下载完整 build.log。
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-build-log
          # 容器内通过 -v "${GITHUB_WORKSPACE}:/workspace" 挂载，日志写在 /workspace/build.log，
          # 即宿主工作目录下的 build.log，无需额外 cp。
          path: build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuenMoney-${{ env.VERSION }}-hap
          path: app/SuenMoney-${{ env.VERSION }}-unsigned.hap
          retention-days: 30

      # 清理 Release 上的冗余历史资产（如 build.log、无版本号或重复命名产物）
      - name: Clean Up Redundant Release Assets
        # 与发布同策略：只有 v* tag 才允许改动 Release。
        # 原因：push main 时产物版本号来自 VERSION 文件，常与已发布 Release 同名，
        # 此时清理/覆盖会造成已发布内容被静默改动或混版。
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const token = process.env.GITHUB_TOKEN;
            const repo = process.env.GITHUB_REPOSITORY;
            const tag = process.env.VERSION;
            const headers = {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "User-Agent": "SuenMoney-CI"
            };

            async function cleanup() {
              const res = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, { headers });
              if (!res.ok) {
                console.log(`Release ${tag} 暂不存在或未创建，跳过清理`);
                return;
              }
              const release = await res.json();
              // 规范产物名单：Android release.apk / iOS release.ipa / 鸿蒙 unsigned.hap
              const allowedPatterns = [
                /^SuenMoney-v[\d.]+-release\.apk$/,
                /^SuenMoney-v[\d.]+-release\.ipa$/,
                /^SuenMoney-v[\d.]+-unsigned\.hap$/
              ];

              for (const asset of release.assets || []) {
                const isAllowed = allowedPatterns.some(re => re.test(asset.name));
                if (!isAllowed) {
                  console.log(`正在从 Release 清理冗余资产: ${asset.name} (ID: ${asset.id})...`);
                  const delRes = await fetch(`https://api.github.com/repos/${repo}/releases/assets/${asset.id}`, {
                    method: "DELETE",
                    headers
                  });
                  if (delRes.status === 204) {
                    console.log(`✔ 已成功清理: ${asset.name}`);
                  } else {
                    console.warn(`✖ 清理失败 ${asset.name}: HTTP ${delRes.status}`);
                  }
                }
              }
            }
            cleanup().catch(err => {
              console.error("清理冗余资产异常:", err);
            });
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上面的 Upload Build Log / Upload HAP Artifact 均无 main/master 判断，
      # push main 时照常上传 Actions artifact，保持「随时下载最新包测试」的能力。
      - name: Publish GitHub Release
        # 只有推送 v* tag 才允许创建/更新 Release。
        # 原因：若允许 push main 发版，当 VERSION 文件未变时，新产物会覆盖同名已发布
        # Release 里的旧产物（曾发生 v1.1.5 APK 被静默替换）；若此时另一端构建失败，
        # 同一个 Release 就会混版。Release 是对外发布物，必须由不可变的 tag 触发。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SuenMoney ${{ env.VERSION }} 移动端
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ### SuenMoney ${{ env.VERSION }} 移动端发布 🎉

            #### 📱 安装包（统一在 `app/` 目录）：
            - `SuenMoney-${{ env.VERSION }}-release.apk`：安卓正式安装包，下载后可直接在手机上点击安装。
            - `SuenMoney-${{ env.VERSION }}-release.ipa`：iOS 未签名安装包，可使用 AltStore / SideStore / TrollStore 等重签工具安装。
            - `SuenMoney-${{ env.VERSION }}-unsigned.hap`：鸿蒙 NEXT 未签名安装包，可使用 DevEco Studio 或自签工具在纯血鸿蒙设备上安装运行。

            > ⚠️ **请从本 Release 下载附件安装**。Actions 页面里的 Artifact 是 GitHub 额外套的一层 zip，直接改后缀丢给安装工具会报错。
            >
            > 由 GitHub Actions 自动化流水线构建。
            ${{ inputs.release_notes && format('#### 📝 更新说明：\n{0}', inputs.release_notes) || '' }}
          files: |
            app/SuenMoney-${{ env.VERSION }}-unsigned.hap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
