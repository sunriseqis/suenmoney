name: Build HarmonyOS HAP

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'hw/**'
      - 'web/**'
      - 'VERSION'
      - 'scripts/build-hw.mjs'
      - 'scripts/sync-hw.mjs'
      - '.github/workflows/build-hw.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号（可选，例如 1.1，留空则默认按 VERSION 文件）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '是否发布到 GitHub Release'
        required: true
        type: boolean
        default: true
      release_notes:
        description: '发布说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-hw:
    name: Build HarmonyOS HAP (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # versionCode 需计算提交历史数，必须是完整历史
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Determine Version
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((10000 + COMMIT_COUNT))
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          BASE_VER="1.0"
          if [ -f "VERSION" ]; then
            BASE_VER=$(cat VERSION | tr -d ' \n\r')
          fi

          CUSTOM_VER="${{ inputs.custom_version }}"
          if [ -n "$CUSTOM_VER" ]; then
            VERSION_NAME="$CUSTOM_VER"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            VERSION_NAME="${TAG_VER}"
          else
            VERSION_NAME="${BASE_VER}"
          fi

          VERSION="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "✔ 目标版本: ${VERSION} (VersionCode: ${VERSION_CODE})"

      - name: Build Web Assets and Sync to HarmonyOS
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          node scripts/sync-hw.mjs

      - name: Build HarmonyOS Unsigned HAP
        run: |
          echo "=== 启动 HarmonyOS 云端构建容器 (API 26r / command-line-tools) ==="
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/hw \
            ghcr.io/dalongzhuazi/harmonyos-ci:api26r \
            bash -c "
              set -x
              sed -i 's/"versionName": "[^"]*"/"versionName": "${{ env.VERSION_NAME }}"/g' AppScope/app.json5 || true
              sed -i 's/"versionCode": [0-9]*/"versionCode": ${{ env.VERSION_CODE }}/g' AppScope/app.json5 || true
              ohpm install --all || true

              echo '--- 开始执行 Hvigor 构建 ---'
              hvigorw assembleHap \
                --mode module \
                -p product=default \
                -p buildMode=debug \
                --no-daemon \
                --stacktrace 2>&1 | tee /workspace/build.log

              echo '--- 查找构建产物 ---'
              mkdir -p /workspace/app
              FOUND_HAP=$(find /workspace/hw -type f -name '*.hap' | head -n 1)
              if [ -n "$FOUND_HAP" ] && [ -f "$FOUND_HAP" ]; then
                echo "找到产物: $FOUND_HAP"
                cp -v "$FOUND_HAP" /workspace/app/SuenMoney-${{ env.VERSION }}-unsigned.hap
                cp -v "$FOUND_HAP" /workspace/app/SuenMoney-${{ env.VERSION }}-release.hap
              else
                echo "未在 /workspace/hw 找到 .hap，检索工作区:"
                find /workspace -type f -name '*.hap' || true
              fi
              chmod -R 777 /workspace/app /workspace/hw/build /workspace/hw/entry/build /workspace/build.log 2>/dev/null || true
            "

      # 产物校验
      - name: Verify Artifact
        run: |
          ls -lh app/ 2>/dev/null || true
          HAP="app/SuenMoney-${{ env.VERSION }}-unsigned.hap"
          if [ ! -f "$HAP" ]; then
            echo "✖ 未找到 $HAP！输出构建日志末尾 120 行：" >&2
            tail -n 120 build.log 2>/dev/null || true
            exit 1
          fi

          # 校验 HAP 文件完整性（HAP 本质是 ZIP 包容器）
          unzip -t "$HAP" > /dev/null || { echo "✖ HAP 完整性校验失败"; exit 1; }
          echo "✔ HAP 完整性校验通过（包含 $(unzip -l "$HAP" | tail -1 | awk '{print $2}') 个条目）"

      - name: Upload Build Log to Release on Failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SuenMoney ${{ env.VERSION }} 移动端
          files: |
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuenMoney-${{ env.VERSION }}-hap
          path: app/*.hap
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SuenMoney ${{ env.VERSION }} 移动端
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ### SuenMoney ${{ env.VERSION }} 移动端发布 🎉

            #### 📱 安装包（统一在 `app/` 目录）：
            - `SuenMoney-${{ env.VERSION }}-release.apk`：安卓正式安装包，下载后可直接在手机上点击安装。
            - `SuenMoney-${{ env.VERSION }}-release.ipa`：iOS 未签名安装包，可使用 AltStore / SideStore / TrollStore 等重签工具安装。
            - `SuenMoney-${{ env.VERSION }}-unsigned.hap`：鸿蒙 NEXT 未签名安装包，可使用 DevEco Studio 或自签工具在纯血鸿蒙设备上安装运行。

            > ⚠️ **请从本 Release 下载附件安装**。Actions 页面里的 Artifact 是 GitHub 额外套的一层 zip，直接改后缀丢给安装工具会报错。
            >
            > 由 GitHub Actions 自动化流水线构建。
            ${{ inputs.release_notes && format('#### 📝 更新说明：\n{0}', inputs.release_notes) || '' }}
          files: |
            app/*.hap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
