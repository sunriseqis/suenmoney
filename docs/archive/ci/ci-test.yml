# ==============================================================================
# 【已归档 · 作废 · 不在 CI 里运行】
#
# 归档原因（用户 2026-10-31 裁决）：不做 CI 门禁 —— 本地推远端前都跑过 `npm run check`，CI 上再跑一遍没有信息增量。本工作流已作废，从 CI 移除。
# 归档时间：2026-10-31　　原位置：.github/workflows/ci-test.yml
#
# 本文件**不会被 GitHub Actions 加载**（不在 .github/workflows/ 下）。
# 要恢复：移回 .github/workflows/ 并确认 on: 段（当前都是 workflow_dispatch 手动派发）。
# 背景见 docs/ci.md。
# ==============================================================================
name: CI Test & Lint

# ⚠ 自动构建已关闭（2026-10-21）：本工作流只保留手动派发（workflow_dispatch）。
#   存储/额度都是自己掏的，日常推送不该自动烧构建；需要构建时手动派发，
#   恢复自动触发的做法见 docs/ci.md，原触发器原文可从 git 历史取回。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Run Typecheck, Tests and Web Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm --prefix server ci
          npm --prefix web ci

      - name: Run Full Checks
        run: |
          npm run check
