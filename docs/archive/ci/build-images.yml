# ==============================================================================
# 【已归档 · 作废 · 不在 CI 里运行】
#
# 归档原因（用户 2026-10-31 裁决）：镜像 CI 暂时不做。本工作流已作废，从 CI 移除。
# 归档时间：2026-10-31　　原位置：.github/workflows/build-images.yml
#
# ⚠ 2026-11-20 更新：镜像流水线已重新上线，但**不是**恢复本文件 ——
#   取而代之的是 `.github/workflows/build-image.yml`。本文件保留仅供追溯，
#   不要原样搬回 `.github/workflows/`，原因有三：
#     1. `type=semver` 解析不了 `suenmoney-vX.Y.Z` 这种 tag（不是标准 semver），
#        版本 tag 实际只来自 custom_tag，等于「发版镜像没有版本号」；
#     2. `type=raw,value=latest,enable={{is_default_branch}}` 在 tag 事件下
#        is_default_branch=false → **latest 永远不会更新**，而 compose 引用的正是
#        `:latest`，用户拉到的还是旧镜像；
#     3. 没有发布到 suenapp 发行页的步骤（新的要求：镜像进 GHCR，发行页写一节）。
#   新文件的触发方式是「推 suenmoney-v* tag」，细节见 docs/ci.md。
#
# 本文件**不会被 GitHub Actions 加载**（不在 .github/workflows/ 下）。
# 背景见 docs/ci.md。
# ==============================================================================
name: Build and Push Image to GHCR

# ==============================================================================
# 单镜像构建：前端与服务端打进同一个镜像，一个进程同时提供页面与 /api。
#
# **手动派发**（不再随推送自动构建，见文件下方 on: 段与 docs/ci.md）。
# 手动跑时默认推 latest；带 tag 派发则额外推 semver（tags 规则仍在 metadata-action 里）。
# 多架构 linux/amd64 + linux/arm64。
#
# 历史镜像 `suenmoney-server` / `suenmoney-web` **不再更新**，保留在 GHCR 供回滚；
# 新部署一律使用 `suenmoney`。
# ==============================================================================

# ⚠ 自动构建已关闭（2026-10-21）：本工作流只保留手动派发（workflow_dispatch）。
#   存储/额度都是自己掏的，日常推送不该自动烧构建；需要构建时手动派发，
#   恢复自动触发的做法见 docs/ci.md，原触发器原文可从 git 历史取回。
on:
  workflow_dispatch:
    inputs:
      push_images:
        description: '是否推送到 ghcr.io'
        required: true
        type: boolean
        default: true
      custom_tag:
        description: '自定义镜像 Tag（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build & Push SuenMoney Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU (Multi-arch support)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Lowercase Owner Name
        id: owner
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LC}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/suenmoney
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}

      # 构建上下文是仓库根：镜像里同时要有 web/dist 与 server/ 源码
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=suenmoney
          cache-to: type=gha,mode=max,scope=suenmoney
