<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="SuenMoney">
  <!-- v3 母版｜1024 方形全出血｜零描边（靠 surface 色阶分层）｜发光=分组模糊一次 -->
  <defs>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="26"/></filter>
    <g id="lit">
      <rect x="100" y="208" width="176" height="176" rx="52" fill="#4DFFD2"/>
      <rect x="316" y="208" width="176" height="176" rx="52" fill="#4DFFD2"/>
      <rect x="100" y="424" width="176" height="176" rx="52" fill="#B388FF"/>
      <rect x="532" y="424" width="176" height="176" rx="52" fill="#5DB8FF"/>
      <rect x="100" y="640" width="176" height="176" rx="52" fill="#5DB8FF"/>
      <rect x="316" y="640" width="176" height="176" rx="52" fill="#FF7AB8"/>
      <rect x="748" y="208" width="176" height="176" rx="52" fill="#E5FF41"/>
      <rect x="748" y="424" width="176" height="176" rx="52" fill="#E5FF41"/>
      <rect x="748" y="640" width="176" height="176" rx="52" fill="#E5FF41"/>
    </g>
    <g id="dim">
      <rect x="532" y="208" width="176" height="176" rx="52" fill="#282740"/>
      <rect x="316" y="424" width="176" height="176" rx="52" fill="#282740"/>
      <rect x="532" y="640" width="176" height="176" rx="52" fill="#282740"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="#141222"/>
  <rect x="56" y="56" width="912" height="912" rx="200" fill="#1E1D2E"/>
  <use href="#dim"/>
  <use href="#lit" filter="url(#glow)" opacity=".42"/>
  <use href="#lit"/>
</svg>
