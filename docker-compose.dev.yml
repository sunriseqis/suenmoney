# ==============================================================================
# 本地开发构建覆写（可选，部署机不需要）
#
# docker-compose.yml 是纯拉取部署（镜像来自 GHCR）；要在本地从源码构建镜像时，
# 叠加本覆写文件：
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 构建上下文是**仓库根目录**：前端与服务端要一起打进同一个镜像，
# 所以根 Dockerfile 必须同时看得到 server/ 与 web/ 两侧的源码。
# ==============================================================================

services:
  suenmoney:
    build:
      context: .
      dockerfile: Dockerfile
